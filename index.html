<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebrew Prayer Display</title>
    <style>
        /* Fixed indentation and reordered CSS for better organization */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Fixed: Removed extra tab before body selector */
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            width: 100%;
            flex-direction: column;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        p#date, p#dateonly {
            margin: 0;
            font-size: 1.2em;
            text-align: center;
            color: #2980b9;
            padding-bottom: 10px;
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 20px;
        }

        table {
            margin: 20px auto;
            width: 80%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            table-layout: fixed;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2980b9;
            color: #fff;
            text-transform: uppercase;
        }

        td {
            font-size: 1.1em;
        }

        .hebrew {
            direction: rtl;
            font-family: 'David Libre', serif;
        }

        td#hebrew-nasi, td#hebrew-yehiRatzon {  /* Fixed: Changed IDs to match HTML */
            font-size: 1.3em;
        }

        .section-title {
            text-align: center;
            margin-top: 40px;
            font-size: 1.4em;
        }

        .link-button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s;
        }

        .link-button:hover {
            background-color: #1a5276;
        }

            border: none;
            color: white;

            cursor: pointer;
